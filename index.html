<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centro Médico</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12303a;--mu:#5d7279;--bg:#f3f7f7;--card:#fff;--bd:#dde8e8;--pri:#0e8a7d;--pri-d:#0a6b61;--wash:#e3f3f0;--rail:#0f2f38;
--pen:#b7791f;--pen-b:#fdf3dc;--con:#2563a8;--con-b:#e2eefb;--ate:#1f8a5b;--ate-b:#e0f4ea;--can:#8a5a5a;--can-b:#f6e6e6;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7cc9c0;outline-offset:2px}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.rail{background:var(--rail);color:#d7e8e6;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;color:#fff;padding:0 6px 18px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--pri);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-radius:12px;background:none;color:#b9d2cf;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.on{background:var(--pri);color:#fff}
.who{margin-top:auto;padding:12px;border-radius:12px;background:rgba(255,255,255,.07);font-size:.9rem}
.who b{display:block;color:#fff}.who span{color:#9fbdb9}
.who button{margin-top:8px;border:0;background:none;color:#9fbdb9;cursor:pointer;display:flex;gap:8px;align-items:center;padding:0}
main{padding:28px clamp(16px,4vw,44px) 40px;max-width:1040px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:clamp(1.5rem,3.4vw,2rem);line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mu);margin:4px 0 0;text-transform:capitalize}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{background:var(--pri-d)}
.btn.soft{background:var(--wash);color:var(--pri-d)}.btn.soft:hover{background:#d3ece8}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.9rem}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar input[type=date]{width:auto}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{padding:5px 12px;border-radius:99px;font-size:.88rem;font-weight:600}
.pill{padding:3px 11px;border-radius:99px;font-size:.82rem;font-weight:600;display:inline-block}
.pendiente{background:var(--pen-b);color:var(--pen)}.confirmada{background:var(--con-b);color:var(--con)}
.atendida{background:var(--ate-b);color:var(--ate)}.cancelada{background:var(--can-b);color:var(--can)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.cita{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;margin-bottom:10px;padding:14px 16px}
.hora{text-align:center;border-right:2px solid var(--wash);padding-right:12px}
.hora b{display:block;font-size:1.25rem}.hora span{font-size:.8rem;color:var(--mu)}
.cita.x .nom{text-decoration:line-through;opacity:.55}
.nom{font-weight:700}.mu{color:var(--mu);font-size:.92rem}
select.est{border-radius:99px;border:0;padding:7px 12px;font-weight:600;font-size:.88rem;cursor:pointer;min-height:36px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #c9d9d9;border-radius:11px;background:#fff;min-height:44px}
textarea{resize:vertical}
label{display:block;font-size:.88rem;font-weight:600;margin:12px 0 5px;color:#35525a}
.vacio{text-align:center;padding:36px 16px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pac{display:flex;gap:12px;align-items:flex-start}
.av{width:46px;height:46px;border-radius:50%;background:var(--wash);color:var(--pri-d);display:grid;place-items:center;font-weight:700;flex:none}
.pac .btn{margin-top:10px}
.tl{border-left:3px solid var(--wash);margin-left:6px;padding-left:18px}
.tl .card{margin-bottom:12px;position:relative}
.tl .card::before{content:"";position:absolute;left:-26px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--pri);border:3px solid var(--bg)}
.tl dl{margin:8px 0 0;display:grid;grid-template-columns:110px 1fr;gap:4px 10px}
.tl dt{color:var(--mu);font-size:.9rem}.tl dd{margin:0;white-space:pre-wrap}
dialog{border:0;border-radius:18px;padding:22px;width:min(520px,calc(100vw - 24px));max-height:90vh;color:var(--ink);box-shadow:0 20px 60px rgba(10,40,45,.3)}
dialog::backdrop{background:rgba(10,35,40,.5)}
dialog h2{margin:0 0 4px;font-size:1.3rem}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#e3f3f0,#f3f7f7 60%)}
.login .card{width:min(400px,100%);padding:30px 26px}
.login .logo{margin-bottom:14px}.login h1{font-size:1.5rem}
.err{color:#a33a2a;min-height:1.4em;margin:10px 0 0;font-size:.92rem}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 .rail{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -6px 24px rgba(10,40,45,.2)}
 .brand,.who{display:none}
 .nav{flex-direction:row;flex:1;gap:4px}.nav button{flex:1;flex-direction:column;gap:2px;font-size:.78rem;padding:7px 4px;justify-content:center;align-items:center}
 main{padding-bottom:100px}
 .mtop{display:flex!important}
 .cita{grid-template-columns:70px 1fr;}.cita .est{grid-column:1/-1}
 dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:20px 20px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
 .two{grid-template-columns:1fr}.tl dl{grid-template-columns:1fr}
}
.mtop{display:none;align-items:center;gap:10px;margin:-8px 0 14px;color:var(--mu);font-size:.9rem;justify-content:space-between}
.mtop button{border:0;background:var(--wash);color:var(--pri-d);border-radius:10px;padding:6px 12px;font-weight:600;cursor:pointer}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translateY(14px)}}}
</style></head><body><div id="app"></div><dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// === CONFIGURACIÓN ===
const CENTRO = 'Centro Médico';
const SUPABASE_URL = 'https://orhnorctnymwdxdnofop.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9yaG5vcmN0bnltd2R4ZG5vZm9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNTI5MTYsImV4cCI6MjEwODcyODkxNn0.9D2mDYD8kdOK5G_5bX7ylqkldzYKLBpp8Wx4d_-7Qvs';
// =====================
let sb = null, fallo = '';
if (typeof supabase === 'undefined') fallo = 'No se pudo cargar la librería de Supabase. Revisa tu conexión a internet.';
else if (SUPABASE_URL.startsWith('PEGAR') || SUPABASE_KEY.startsWith('PEGAR')) fallo = 'Falta configurar la URL y la clave de Supabase en index.html.';
else { try { sb = supabase.createClient(new URL(SUPABASE_URL.trim()).origin, SUPABASE_KEY.trim()); } catch (e) { fallo = 'Configuración inválida: ' + e.message; } }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hm = iso => { const d = new Date(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fdt = iso => new Date(iso).toLocaleDateString('es-BO', { day: 'numeric', month: 'short', year: 'numeric' }) + ' · ' + hm(iso);
const ESTADOS = ['pendiente', 'confirmada', 'atendida', 'cancelada'];
const ic = {
  cal: '<path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', l: '<path d="M15 18l-6-6 6-6"/>', r: '<path d="M9 18l6-6-6-6"/>'
};
const svg = n => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic[n]}</svg>`;
const LOGO = '<span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>';
let me = null, tab = 'agenda', day = ymd(new Date()), pacs = [], selP = '', filtro = '';
const isMed = () => me && me.rol === 'medico';
const ini = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const edad = f => { if (!f) return ''; const d = new Date(f), t = new Date(); let a = t.getFullYear() - d.getFullYear(); if (t < new Date(t.getFullYear(), d.getMonth(), d.getDate())) a--; return a + ' años'; };
const saludo = () => { const h = new Date().getHours(); return h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches'; };
const cerrar = () => $('#dlg').close();
const abrir = h => { $('#dlg').innerHTML = h; $('#dlg').showModal(); };

async function init() {
  if (fallo) { $('#app').innerHTML = `<div class="login"><div class="card">${LOGO}<h1>${esc(CENTRO)}</h1><p class="err">${esc(fallo)}</p></div></div>`; return; }
  const { data } = await sb.auth.getSession();
  if (!data.session) return loginView();
  const { data: p, error } = await sb.from('profiles').select('*').eq('id', data.session.user.id).maybeSingle();
  if (error || !p) { $('#app').innerHTML = `<div class="login"><div class="card">${LOGO}<h1>Sin rol asignado</h1><p class="mu">Tu usuario aún no tiene un rol. Pide al administrador que lo configure.</p><button class="btn soft" onclick="salir()">Salir</button></div></div>`; return; }
  me = p; await cargarPacs(); render();
}
function loginView() {
  $('#app').innerHTML = `<div class="login"><div class="card">${LOGO}<h1>${esc(CENTRO)}</h1><p class="mu" style="margin:4px 0 8px">Ingreso del personal</p>
  <label for="em">Correo</label><input id="em" type="email" autocomplete="username"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password">
  <p class="err" id="err" role="alert"></p><button class="btn" id="go" style="width:100%;justify-content:center;margin-top:6px">Ingresar</button></div></div>`;
  const go = async () => {
    $('#err').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (error) $('#err').textContent = 'No se pudo ingresar: ' + error.message; else init();
  };
  $('#go').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}
async function salir() { await sb.auth.signOut(); me = null; loginView(); }
async function cargarPacs() {
  const { data, error } = await sb.from('pacientes').select('*').order('nombre');
  if (error) alert(error.message); pacs = data || [];
}
function render() {
  const tabs = [['agenda', 'Agenda', 'cal'], ['pacientes', 'Pacientes', 'users']];
  if (isMed()) tabs.push(['historial', 'Historiales', 'file']);
  $('#app').innerHTML = `<div class="app"><aside class="rail"><div class="brand">${LOGO}<span>${esc(CENTRO)}</span></div>
  <nav class="nav">${tabs.map(t => `<button data-tab="${t[0]}" class="${tab === t[0] ? 'on' : ''}">${svg(t[2])}<span>${t[1]}</span></button>`).join('')}</nav>
  <div class="who"><b>${esc(me.nombre)}</b><span>${isMed() ? 'Médico' : 'Secretaría'}</span><button onclick="salir()">${svg('out')} Cerrar sesión</button></div></aside>
  <main><div class="mtop"><span>${esc(me.nombre)} · ${isMed() ? 'Médico' : 'Secretaría'}</span><button onclick="salir()">Salir</button></div><div id="v"></div></main></div>`;
  if (tab === 'agenda') agenda(); else if (tab === 'pacientes') pacientes(); else historial();
}
const head = (t, s, btn) => `<div class="head"><div><h1>${t}</h1><p class="sub">${s}</p></div>${btn || ''}</div>`;
const opts = sel => pacs.map(p => `<option value="${p.id}" ${String(p.id) === String(sel) ? 'selected' : ''}>${esc(p.nombre)}${p.ci ? ' · ' + esc(p.ci) : ''}</option>`).join('');

async function agenda() {
  const a = new Date(day + 'T00:00:00'), b = new Date(a); b.setDate(b.getDate() + 1);
  const { data, error } = await sb.from('citas').select('*, pacientes(nombre,telefono)').gte('inicio', a.toISOString()).lt('inicio', b.toISOString()).order('inicio');
  if (error) return alert(error.message);
  const cs = data || [], n = e => cs.filter(c => c.estado === e).length;
  const fecha = a.toLocaleDateString('es-BO', { weekday: 'long', day: 'numeric', month: 'long' });
  $('#v').innerHTML = head(day === ymd(new Date()) ? saludo() + ', ' + esc(me.nombre.replace(/^Dr\.?\s*/i, '')) : 'Agenda', fecha, `<button class="btn" data-act="nueva-cita">${svg('plus')} Nueva cita</button>`) +
  `<div class="bar"><button class="ib" data-mov="-1" aria-label="Día anterior">${svg('l')}</button><input type="date" id="dia" value="${day}" aria-label="Elegir día"><button class="ib" data-mov="1" aria-label="Día siguiente">${svg('r')}</button><button class="btn soft sm" data-mov="0">Hoy</button></div>
  <div class="chips"><span class="chip" style="background:#e8efef">${cs.length} citas</span>${ESTADOS.filter(e => n(e)).map(e => `<span class="chip ${e}">${n(e)} ${e}${n(e) > 1 && e !== 'cancelada' ? 's' : n(e) > 1 ? 's' : ''}</span>`).join('')}</div>` +
  (cs.map(c => `<div class="card cita ${c.estado === 'cancelada' ? 'x' : ''}"><div class="hora"><b>${hm(c.inicio)}</b><span>${c.duracion} min</span></div>
  <div><div class="nom">${esc(c.pacientes?.nombre)}</div><div class="mu">${esc(c.motivo) || 'Sin motivo indicado'}${c.pacientes?.telefono ? ' · Tel. ' + esc(c.pacientes.telefono) : ''}</div></div>
  <select class="est ${c.estado}" data-cita="${c.id}" aria-label="Estado de la cita">${ESTADOS.map(e => `<option ${e === c.estado ? 'selected' : ''}>${e}</option>`).join('')}</select></div>`).join('') ||
  `<div class="card vacio">No hay citas este día.<br>Usa «Nueva cita» para agendar la primera.</div>`);
  $('#dia').onchange = e => { day = e.target.value || day; agenda(); };
}
function nuevaCita() {
  abrir(`<h2>Nueva cita</h2><label for="cp">Paciente</label><select id="cp"><option value="">Elegir paciente…</option>${opts('')}</select>
  <div class="two"><div><label for="ci">Fecha y hora</label><input type="datetime-local" id="ci" value="${day}T09:00"></div><div><label for="cd">Duración (min)</label><input type="number" id="cd" value="30" min="5"></div></div>
  <label for="cm">Motivo de la consulta</label><input id="cm"><p class="err" id="ce" role="alert"></p>
  <div class="acts"><button class="btn soft" onclick="cerrar()">Cancelar</button><button class="btn" id="gc">Agendar cita</button></div>`);
  $('#gc').onclick = async () => {
    if (!$('#cp').value || !$('#ci').value) { $('#ce').textContent = 'Elige un paciente y una fecha.'; return; }
    const { error } = await sb.from('citas').insert({ paciente_id: +$('#cp').value, inicio: new Date($('#ci').value).toISOString(), duracion: +$('#cd').value || 30, motivo: $('#cm').value.trim() });
    if (error) $('#ce').textContent = error.message; else { day = $('#ci').value.slice(0, 10); cerrar(); agenda(); }
  };
}
function listaPacs() {
  const l = pacs.filter(p => (p.nombre + ' ' + (p.ci || '')).toLowerCase().includes(filtro.toLowerCase()));
  $('#lista').innerHTML = l.map(p => `<div class="card pac"><div class="av">${esc(ini(p.nombre))}</div><div><div class="nom">${esc(p.nombre)}</div>
  <div class="mu">${p.ci ? 'CI ' + esc(p.ci) : 'Sin CI'}${p.fecha_nac ? ' · ' + edad(p.fecha_nac) : ''}</div><div class="mu">${p.telefono ? 'Tel. ' + esc(p.telefono) : 'Sin teléfono'}</div>
  ${isMed() ? `<button class="btn soft sm" data-hist="${p.id}">Ver historial</button>` : ''}</div></div>`).join('') || '<div class="card vacio" style="grid-column:1/-1">No hay pacientes que coincidan.</div>';
}
function pacientes() {
  $('#v').innerHTML = head('Pacientes', pacs.length + ' registrados', `<button class="btn" data-act="nuevo-pac">${svg('plus')} Nuevo paciente</button>`) +
  `<div class="bar"><input id="bq" type="search" placeholder="Buscar por nombre o CI" value="${esc(filtro)}" aria-label="Buscar paciente" style="max-width:420px"></div><div class="grid" id="lista"></div>`;
  listaPacs(); $('#bq').oninput = e => { filtro = e.target.value; listaPacs(); };
}
function nuevoPac() {
  abrir(`<h2>Nuevo paciente</h2><label for="pn">Nombre completo</label><input id="pn" autocomplete="off">
  <div class="two"><div><label for="pc">CI</label><input id="pc"></div><div><label for="pf">Fecha de nacimiento</label><input id="pf" type="date"></div></div>
  <label for="pt">Teléfono</label><input id="pt" type="tel"><p class="err" id="pe" role="alert"></p>
  <div class="acts"><button class="btn soft" onclick="cerrar()">Cancelar</button><button class="btn" id="gp">Guardar paciente</button></div>`);
  $('#gp').onclick = async () => {
    const n = $('#pn').value.trim(); if (!n) { $('#pe').textContent = 'Escribe el nombre del paciente.'; return; }
    const { error } = await sb.from('pacientes').insert({ nombre: n, ci: $('#pc').value.trim() || null, telefono: $('#pt').value.trim() || null, fecha_nac: $('#pf').value || null });
    if (error) $('#pe').textContent = error.message; else { cerrar(); await cargarPacs(); pacientes(); }
  };
}
async function historial() {
  const p = pacs.find(x => String(x.id) === String(selP));
  $('#v').innerHTML = head('Historiales clínicos', 'Solo visibles para el médico', p ? `<button class="btn" data-act="nueva-consulta">${svg('plus')} Nueva consulta</button>` : '') +
  `<div class="card" style="margin-bottom:16px"><label for="hp" style="margin-top:0">Paciente</label><select id="hp"><option value="">Elegir paciente…</option>${opts(selP)}</select></div><div id="hv"></div>`;
  $('#hp').onchange = e => { selP = e.target.value; historial(); };
  if (!p) { $('#hv').innerHTML = '<div class="card vacio">Elige un paciente para ver su historial.</div>'; return; }
  const { data, error } = await sb.from('historiales').select('*').eq('paciente_id', selP).order('fecha', { ascending: false });
  if (error) return alert(error.message);
  const fila = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : '';
  $('#hv').innerHTML = `<div class="tl">${(data || []).map(x => `<div class="card"><b>${fdt(x.fecha)}</b><div class="mu">${esc(x.motivo) || 'Sin motivo indicado'}</div>
  <dl>${fila('Diagnóstico', x.diagnostico)}${fila('Tratamiento', x.tratamiento)}${fila('Notas', x.notas)}</dl></div>`).join('') || '<div class="card vacio">Aún no hay consultas registradas para ' + esc(p.nombre) + '.</div>'}</div>`;
}
function nuevaConsulta() {
  abrir(`<h2>Nueva consulta</h2><label for="hm">Motivo</label><input id="hm"><label for="hd">Diagnóstico</label><textarea id="hd" rows="2"></textarea>
  <label for="ht">Tratamiento</label><textarea id="ht" rows="2"></textarea><label for="hn">Notas</label><textarea id="hn" rows="3"></textarea><p class="err" id="he" role="alert"></p>
  <div class="acts"><button class="btn soft" onclick="cerrar()">Cancelar</button><button class="btn" id="gh">Guardar en historial</button></div>`);
  $('#gh').onclick = async () => {
    const { error } = await sb.from('historiales').insert({ paciente_id: +selP, motivo: $('#hm').value.trim(), diagnostico: $('#hd').value.trim(), tratamiento: $('#ht').value.trim(), notas: $('#hn').value.trim() });
    if (error) $('#he').textContent = error.message; else { cerrar(); historial(); }
  };
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; render(); return; }
  const h = e.target.closest('[data-hist]'); if (h) { selP = h.dataset.hist; tab = 'historial'; render(); return; }
  const m = e.target.closest('[data-mov]'); if (m) { const v = +m.dataset.mov, d = new Date(day + 'T00:00:00'); if (v) d.setDate(d.getDate() + v); else d.setTime(Date.now()); day = ymd(d); agenda(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  ({ 'nueva-cita': nuevaCita, 'nuevo-pac': nuevoPac, 'nueva-consulta': nuevaConsulta })[a.dataset.act]();
});
document.addEventListener('change', async e => {
  const id = e.target.dataset && e.target.dataset.cita; if (!id) return;
  const { error } = await sb.from('citas').update({ estado: e.target.value }).eq('id', id);
  if (error) alert(error.message); else agenda();
});
init();
</script></body></html>
